# The whole verification sweep, on GitHub's runners instead of a laptop.
#
# tools/verify/run_all.sh is one script because on a 47GB workstation the
# whole thing is an hour. A GitHub runner is 4 cores and 16GB with a
# 6-hour job limit, so the same work has to be a PIPELINE: each stage its
# own job, passing its output on as an artifact.
#
# Every stage already supports --resume, which is what makes this safe to
# split. A stage that runs out of time leaves its .partial.jsonl behind in
# the artifact, and re-running the workflow with that artifact restored
# continues rather than starting again.
#
# Timings from the 31-job workstation run, scaled to 4 cores:
#
#   classify userland   1295 TUs          ~15 min
#   classify kernel     4737 TUs          ~80 min
#   model ub             695 fns          ~20 min
#   model ptr           1893 fns          ~85 min   memory-bound, 2 jobs
#   model ksys          1257 fns          ~65 min
#   analyze             8452 TUs          sharded five ways, ~40 min each
#
# sys/dev has its own analyse shard, as it already had its own model-check
# one. It is 2,633 translation units and the coverage work took the number
# of them that COMPILE from 2,081 to 2,478, which took the `rest' job from
# 32 minutes to over 70 - the cost of reading more of the tree, paid in
# the one job that was already the longest. Splitting it is the same
# division the sweep matrix has made all along.
#
# All well inside six hours, and they run concurrently after classify.
name: PBSD verify

on:
  workflow_dispatch:
    inputs:
      scope_note:
        description: 'Free text recorded in the summary (what this run is for)'
        required: false
        default: ''
  schedule:
    # 03:00 UTC daily. The sweep is the slow instrument; nightly is the
    # cadence it can actually keep.
    - cron: '0 3 * * *'

permissions:
  contents: read

# One sweep at a time. Runs 3, 4 and 5 were all in flight at once while
# the SIGTERM was being diagnosed, which is a confounder to be rid of
# rather than one that explains anything: run 3's kernel job died at
# 15:31 with no other verify run active, so competition for runners was
# never the cause. Memory was, and --mem-mb is the fix. This is so the
# question cannot be raised again about the run that tests it.
#
# cancel-in-progress, because a superseded sweep is three hours of
# runner time spent on a tree nobody is looking at any more.
concurrency:
  group: pbsd-verify
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The ledger counts the files GIT tracks, not the files on disk. The
      # machine that regenerates it also carries an ignored checkout of
      # hbsd/src/contrib/llvm-project, 8,914 of whose files have a source
      # suffix; while the walk was a plain rglob the committed ledger said
      # 50,057 files, this runner regenerated 41,143, and the gate below
      # went red over a difference that was the generator's, not the tree's.
      - name: The ledger reads the tree git has, not the disk
        run: python3 tools/test_port_plan.py
      # docs/port_plan.json is the ledger every stage reads - which file
      # defines which functions - and it is gitignored: 6.9MB generated
      # from the tree, with only the markdown committed.
      - name: Build the function ledger
        run: python3 tools/port_plan.py
      # ...and the markdown half of it is COMMITTED, so it can go stale
      # while this job stays green. It had: regenerating at HEAD rewrote
      # 623 lines, `lib' short by 17 files and the total by 121 lines,
      # because the ledger was describing a tree that no longer exists.
      # A generated file nobody diffs is a reading that quietly stopped
      # matching, which is the failure this repository keeps finding.
      - name: ...and the committed copy still matches the tree
        run: |
          git diff --quiet docs/PORT_PLAN.md || {
            echo "docs/PORT_PLAN.md is stale. Regenerate and commit it:"
            echo "    python3 tools/port_plan.py"
            git --no-pager diff --stat docs/PORT_PLAN.md
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: docs/port_plan.json
          retention-days: 7

  # classify and model check are ONE stage, split across an artifact
  # boundary in the first version of this file - and the boundary could not
  # carry the payload. classify's real output is the goto binaries it
  # writes to --outdir; classes.json is only an index into them. The model
  # jobs downloaded the index, found no binaries, and reported
  #
  #     [1258/1258] 180.0/s  ERROR=1258
  #
  # in seven seconds, with every job in the workflow green. cbmc_driver.py
  # now exits non-zero when nothing at all could be checked, and the two
  # halves run in the same job so there is nothing to carry.
  #
  # SHARDED, because one job holding all of sys was killed at
  #
  #     [200/1258] 0.3/s  BOUNDED=4 ERROR=3 FAILED=74 PROVED=93 TIMEOUT=26
  #     ##[error]The runner has received a shutdown signal.
  #     ##[error]Process completed with exit code 143.
  #
  # 200 of 1258 functions in ten minutes, then SIGTERM at about 280 with
  # nineteen minutes on the clock - the runner was reclaimed, which on a
  # hosted runner is usually memory. Three concurrent CBMC instances on
  # kernel goto binaries is a lot to hold at once.
  #
  # The `if: always()` upload did not save it either: a runner that dies
  # does not run post steps, so the partial .jsonl went with it and
  # --resume had nothing to resume from. Sharding fixes both halves -
  # less held at once, and a shard that dies costs one shard.
  #
  # Shard names and scopes match the analyze matrix below deliberately,
  # so check_shards.py can gate BOTH from one list.
  sweep:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: userland
            scopes: --scope lib/libc --scope lib/msun --scope libexec
            classes: classes.json
            jobs: 4
          - name: kern
            scopes: '--scope sys/kern --scope sys/vm --scope sys/net --scope sys/netinet --scope sys/netinet6'
            classes: classes_sys_kern.json
            jobs: 2
          - name: fs
            scopes: '--scope sys/fs --scope sys/ufs --scope sys/geom --scope sys/cam --scope sys/security --scope sys/cddl'
            classes: classes_sys_fs.json
            jobs: 2
          - name: dev
            scopes: '--scope sys/dev'
            classes: classes_sys_dev.json
            jobs: 2
          - name: rest
            scopes: '--scope sys/arm64 --scope sys/amd64 --scope sys/arm --scope sys/i386 --scope sys/riscv --scope sys/powerpc --scope sys/x86 --scope sys/compat --scope sys/contrib --scope sys/crypto --scope sys/opencrypto --scope sys/ddb --scope sys/isa --scope sys/nfs --scope sys/netgraph --scope sys/netlink --scope sys/rpc --scope sys/kgssapi --scope sys/libkern --scope sys/modules --scope sys/nlm --scope sys/teken --scope sys/tests --scope sys/xen --scope sys/dts --scope sys/gnu --scope sys/sys --scope sys/hardenedbsd --scope sys/netipsec --scope sys/netpfil --scope sys/net80211 --scope sys/netsmb --scope sys/nfsclient --scope sys/nfsserver --scope sys/ofed --scope sys/bsm --scope sys/conf --scope sys/gdb --scope sys/mips --scope sys/tools --scope sys/xdr'
            classes: classes_sys_rest.json
            jobs: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: plan, path: docs }
      - name: Install the instruments
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cbmc clang bmake
      # A check that cannot see reports zero findings, and this repository
      # has been bitten by that four times now. A green sweep from broken
      # instruments is the worst outcome available.
      - name: Prove the instruments work before trusting any number
        run: sh tools/setup_local.sh
      - name: Classify ${{ matrix.name }}
        run: |
          mkdir -p out
          python3 tools/verify/classify.py ${{ matrix.scopes }} \
            --jobs ${{ matrix.jobs }} --resume \
            --outdir "$RUNNER_TEMP/goto" --out out/${{ matrix.classes }}
          df -h "$RUNNER_TEMP" | tail -1
      # SCALAR and VOID, where an unguarded check is sound.
      - name: Model check, unguarded
        if: matrix.name == 'userland'
        run: |
          python3 tools/verify/cbmc_driver.py ${{ matrix.scopes }} \
            --classes out/classes.json --jobs 4 --resume --out out/ub.jsonl
      # POINTER, under a stated precondition. --min-null-tree-depth makes
      # CBMC build a tree of allocated objects per pointer parameter and
      # each solver instance can want gigabytes, so this is memory-bound
      # rather than CPU-bound: two jobs, not four.
      - name: Model check, pointer parameters
        if: matrix.name == 'userland'
        run: |
          python3 tools/verify/cbmc_driver.py ${{ matrix.scopes }} \
            --classes out/classes.json --allow POINTER --null-depth 3 \
            --jobs 2 --timeout 30 --unwind 6 --mem-mb 4096 --resume \
            --out out/ptr.jsonl
      # --mem-mb, which is the bound that was actually missing.
      #
      # Run 4 sharded the kernel four ways, halved --jobs and added
      # --timeout 60, and the dev and rest shards were STILL SIGTERMed:
      #
      #     Terminate orphan process: pid (34642) (cbmc)
      #     ##[error]Process completed with exit code 143.
      #
      # subprocess.run's timeout does bound wall time, so time was never
      # the problem - a single solver can exhaust a 16GB runner well
      # inside sixty seconds. RLIMIT_AS makes that instance fail its
      # allocation and be recorded as one ERROR instead of taking the
      # whole shard, and its artifact, down with it. Verified on
      # lib/libc/stdlib: uncapped FAILED=12 PROVED=10, at --mem-mb 32
      # ERROR=2 FAILED=10 PROVED=10, and at --mem-mb 1 the
      # nothing-could-be-checked gate still exits 1.
      #
      # 4096 with --jobs 2 on a 16GB runner leaves room for the rest.
      - name: Model check ${{ matrix.name }}
        if: matrix.name != 'userland'
        run: |
          python3 tools/verify/cbmc_driver.py ${{ matrix.scopes }} \
            --classes out/${{ matrix.classes }} --jobs ${{ matrix.jobs }} \
            --timeout 60 --mem-mb 4096 --resume \
            --out out/ksys-${{ matrix.name }}.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-${{ matrix.name }}
          path: out/
          retention-days: 7

  # The cheapest instrument, and the one whose corpus grew the most when
  # --target and the per-file include flags landed. Sharded because 8452
  # translation units on four cores is most of an afternoon in one job.
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: libs,   scopes: '--scope lib --scope libexec', check: '--check-errors' }
          # bin, sbin, usr.bin and usr.sbin. This shard ran WITHOUT
          # --check-errors while its hole was being filled: 133 of its
          # 1,862 translation units did not compile, in seven named
          # classes, and an inventory of a hole still being dug goes
          # stale faster than it is written. The condition that comment
          # set was "when the classes are gone", and they are: sweep 20
          # reports 1,822 OK and 40 ERROR, every one of the forty on the
          # record in expected_errors.py.
          #
          # It is not a formality. The first run collected WITH the flag,
          # sweep 19, failed on usr.sbin/gssd/gssd.c -- which had never
          # compiled, because krb5/krb5.h resolved to a stub that
          # includes krb5/krb5.h. Nothing else had noticed in eighteen
          # sweeps. This was the one shard without the gate.
          - { name: progs,  scopes: '--scope bin --scope sbin --scope usr.bin --scope usr.sbin', check: '--check-errors' }
          - { name: kern,   scopes: '--scope sys/kern --scope sys/vm --scope sys/net --scope sys/netinet --scope sys/netinet6', check: '--check-errors' }
          - { name: fs,     scopes: '--scope sys/fs --scope sys/ufs --scope sys/geom --scope sys/cam --scope sys/security --scope sys/cddl', check: '--check-errors' }
          - { name: dev,    scopes: '--scope sys/dev', check: '--check-errors' }
          - { name: rest,   scopes: '--scope sys/arm64 --scope sys/amd64 --scope sys/arm --scope sys/i386 --scope sys/riscv --scope sys/powerpc --scope sys/x86 --scope sys/compat --scope sys/contrib --scope sys/crypto --scope sys/opencrypto --scope sys/ddb --scope sys/isa --scope sys/nfs --scope sys/netgraph --scope sys/netlink --scope sys/rpc --scope sys/kgssapi --scope sys/libkern --scope sys/modules --scope sys/nlm --scope sys/teken --scope sys/tests --scope sys/xen --scope sys/dts --scope sys/gnu --scope sys/sys --scope sys/hardenedbsd --scope sys/netipsec --scope sys/netpfil --scope sys/net80211 --scope sys/netsmb --scope sys/nfsclient --scope sys/nfsserver --scope sys/ofed --scope sys/bsm --scope sys/conf --scope sys/gdb --scope sys/mips --scope sys/tools --scope sys/xdr', check: '--check-errors' }
    steps:
      - uses: actions/checkout@v4
      # bmake as well as clang. Half of what a userland translation unit
      # is compiled with is answered by ASKING the build - a component's
      # CFLAGS, its INCS, which sources it names - and without bmake
      # every one of those answers is empty. An empty answer is not an
      # error here, it is a different set of flags, and so a different
      # ERROR set than the one expected_errors.py was reconciled
      # against: --check-errors would report holes this tree does not
      # have.
      - name: Install the instruments
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang bmake
      # --check-errors, which this step did not pass for three sweeps.
      # The inventory in tools/verify/expected_errors.py was therefore
      # only ever checked where somebody checked it by hand, and the
      # first run of it over the kern shard found three stale exemptions
      # and one shard-wide hole: sys/netinet/cc/cc.c, the congestion
      # control framework, had been reporting "'opt_cc.h' file not
      # found" and contributing nothing to a shard reported as fully
      # read. A file that does not compile is indistinguishable from a
      # clean one in every total this job prints.
      #
      # It exits non-zero on a mismatch, which fails the job - and the
      # artifact upload below is `if: always()', so the sweep's data
      # survives the failure.
      - name: Analyse ${{ matrix.name }}
        run: |
          mkdir -p out
          python3 tools/verify/analyze.py ${{ matrix.scopes }} \
            --jobs 4 ${{ matrix.check }} \
            --out out/analyze-${{ matrix.name }}.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analyze-${{ matrix.name }}
          path: out/
          retention-days: 7

  # The pattern checks are seconds, not hours, and they GATE - so they run
  # on their own rather than behind three hours of model checking.
  lints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # bmake, because the userland half of "does the build name this
      # file" is answered by asking bmake rather than by a second
      # implementation of .PATH and SRCS resolution.
      - name: Install the instruments
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bmake clang
      # An index that answers "no" to everything is indistinguishable
      # from a tree the build names nothing in - which is exactly how
      # sweep_report reported 57 of 57 unlisted ERRORs as "nothing in
      # the build names it" while asking the KERNEL's file list about
      # lib/libc. Each check below is one reading that can go empty.
      - name: The userland build authority still reads the build
        run: python3 tools/verify/test_userland_names.py
      # A file that COMPILES TO NOTHING reports nothing and is counted
      # OK - the same failure expected_errors.py covers one level down,
      # where no inventory was watching. Five kernel sources were in
      # that state, tcp_ratelimit.c's 1,064 lines among them, and the
      # first look at the largest found an out-of-bounds read.
      - name: A translation unit one #ifdef from empty
        run: python3 tools/verify/check_empty_tus.py --gate
      - name: M_NOWAIT results used without a NULL check
        run: python3 tools/verify/nowait_check.py --gate
      - name: A masked switch with fewer arms than states
        run: python3 tools/verify/masked_switch_check.py --gate
      # 72 findings in linux_socket.c rest on the analyser refusing to
      # fold the bound of `for (i = 0; i < lxs_args_cnt[what]; ++i)'.
      # They are false only because that table matches the struct each
      # handler receives - a hand-maintained list of integers in a
      # different file from most of the structs it describes. Too small
      # by one and the handler reads a word of kernel stack the copyin
      # never wrote; for getsockopt that word is an out-pointer.
      - name: Every socketcall copies as many words as its handler declares
        run: python3 tools/verify/socketcall_args.py --gate
      # A scope nobody analyses reports zero findings and looks exactly
      # like one that is clean. The first shard list here missed fourteen
      # directories, sys/hardenedbsd among them.
      - name: Every directory under sys/ is in an analyse shard
        run: python3 tools/verify/check_shards.py
      # Three boot runs of forty minutes each were spent discovering,
      # one undefined symbol at a time, that `options PAX` without a
      # given feature does not link. This answers the question by
      # enumeration in under a second.
      - name: A PaX feature that is off still links
        run: python3 tools/verify/check_pax_options.py
      # systat's get_tbl_ptr(), libcalendar's easterodn() and libc's
      # querylocale() are one shape wearing three sets of clothes: a
      # signed index bounded above and not below, or a signed `%' used
      # as a subscript, which in C keeps the sign of the dividend. All
      # three read memory before the array and two hand what they find
      # back to the caller as a pointer. strsignal(INT_MIN) was the
      # fourth, found by the checker rather than by hand.
      #
      # Only the MOD half gates -- 8 sites tree-wide, every one read and
      # on the record. The ONESIDED half prints its 264 and does not
      # fail: they are internal contracts, and a gate demanding 264
      # readings before the next commit is a gate somebody turns off.
      - name: An array subscript bounded above and not below
        run: python3 tools/verify/onesided_index.py --gate
      - name: The index checker still finds the four it was written for
        run: python3 tools/verify/test_onesided_index.py

      # param_premise.py sorts the sweep's findings by the function they
      # are in, which it works out by reading the text. A rule about where
      # a function begins can be a little bit wrong and still produce a
      # table that looks entirely reasonable, so it is checked against the
      # analyser's own issue_context on real files as well as against the
      # written-out shapes.
      - name: The finding is attributed to the function clang says it is in
        run: python3 tools/verify/test_param_premise.py

      # The default clang checkers have no model for mtx_lock, so a
      # leaked mutex is invisible to the sweep - sys/netipsec/ipsec.c
      # compiles clean and reports nothing, and ipsec_chkreplay() returns
      # holding replay->lock on one of its eleven paths. lock_balance.py
      # is the reader that does see it. Ten of the thirteen it reports
      # over the whole kernel were read and are leaks; the three that are
      # not are named in the test, so a change that stops reporting one
      # of the ten has to say what it did.
      - name: A lock released on some paths out of a function and not others
        run: python3 tools/verify/test_lock_balance.py

      # The socketcall gate above was broken eight ways on the real tree
      # while it was written, and each of those edits is a case here, so
      # the gate is never again only ever observed printing "ok". Five of
      # them are the check going BLIND rather than the tree being wrong -
      # the table renamed, the opcode block gone, a file absent - and
      # those fail whether or not --gate was asked for.
      - name: The socketcall gate still fails on the eight trees it should
        run: python3 tools/verify/test_socketcall_args.py

      # Fifteen core.DivideZero findings under sys/dev/clk/allwinner/ are
      # held off by driver DATA, not by code: AW_CLK_FACTOR_ZERO_BASED
      # gives a clock factor a minimum of zero, and all thirteen uses in
      # the tree are the `n' of an NKMP_CLK, where n MULTIPLIES. A
      # fourteenth on an m, p, div or prediv would make all fifteen live,
      # and nothing in the tree would say so. Per-driver, not per-name:
      # `n' divides in NM_CLK (aw_clk_nm.c:150).
      - name: No zero-based clock factor is one the driver divides by
        run: python3 tools/verify/aw_clk_zero_based.py --gate
      - name: The clock gate still fails on the six trees it should
        run: python3 tools/verify/test_aw_clk_zero_based.py

      # Fifty-three core.NullDereference in lib/libdevstat are one
      # function and one invariant. devstat_compute_statistics() takes
      # the type to pull off its va_list from devstat_arg_list[metric]
      # and the pointer to write through from a `switch (metric)', and
      # the two agree only while row i belongs to metric i. The enum is
      # in devstat.h and the table in devstat.c; devstat.c now carries a
      # _Static_assert for the LENGTH, which is what a compiler can see,
      # and this reads the ORDER, which it cannot -- a table with the
      # right number of rows in the wrong order compiles, and then
      # va_arg() takes a long double * where the caller passed a
      # u_int64_t *.
      - name: devstat_arg_list is in devstat_metric order
        run: python3 tools/verify/devstat_metric_table.py --gate
      - name: ...and the check still fails on a table that has drifted
        run: python3 tools/verify/test_devstat_metric_table.py

      # A landed port that does not COMPILE as C++ raised no [-W...] tag,
      # so the differential above matched its C original's empty set and
      # said nothing. Five lib/msun files were in that state for three
      # days - they #define a lowercase `type' macro and then reach
      # libc++'s <__type_traits/enable_if.h>, where `typedef _Tp type;'
      # stops being a declaration. The check now reads the compiler's
      # exit status as well as its warnings.
      - name: Every landed .cpp port still compiles as C++
        run: python3 tools/check_port_cxx_warnings.py --gate

  report:
    needs: [sweep, analyze]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: 'model-*', path: dl, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { pattern: 'analyze-*', path: dl, merge-multiple: true }
      - name: One report over everything that finished
        # scope_note reaches the shell through the ENVIRONMENT, not
        # through ${{ }}. It used to be interpolated straight into a
        # single-quoted echo, and run 5's note - "run 4's dev and rest
        # shards were SIGTERMed" - ended the quote on its apostrophe:
        #
        #   .sh: line 22: unexpected EOF while looking for matching `''
        #   ##[error]Process completed with exit code 2.
        #
        # after the report had already been computed and printed, so a
        # three-hour sweep produced no artifact over a possessive.
        #
        # The apostrophe is the harmless version. ${{ }} pastes the
        # value in before the shell parses the line, so anyone who can
        # dispatch this workflow could have run arbitrary commands on the
        # runner by putting them in that box. Passing it via env: is the
        # documented fix, and the reason it is worth a paragraph in a
        # repository about undefined behaviour is that it is the same
        # error: text from outside being read as something with meaning.
        env:
          SCOPE_NOTE: ${{ inputs.scope_note }}
        run: |
          ls -la dl/
          # The analyse shards are one corpus split four ways; report.py
          # takes a single --analyze, so concatenate them. A shard that
          # timed out simply is not here, and the report says how many
          # translation units it saw rather than pretending otherwise.
          cat dl/analyze-*.jsonl > dl/analyze.jsonl 2>/dev/null || : > dl/analyze.jsonl
          set --
          for f in dl/ub.jsonl dl/ptr.jsonl dl/ksys-*.jsonl; do
            [ -f "$f" ] && set -- "$@" "$f"
          done
          if [ $# -eq 0 ]; then
            echo "::error title=No model-checker output::every model job failed"
            exit 1
          fi
          python3 tools/verify/report.py "$@" --analyze dl/analyze.jsonl \
            | tee REPORT.txt
          {
            echo '### PBSD verify'
            [ -n "$SCOPE_NOTE" ] && printf '_%s_\n' "$SCOPE_NOTE"
            echo '```'
            head -60 REPORT.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: |
            REPORT.txt
            dl/
          retention-days: 14
