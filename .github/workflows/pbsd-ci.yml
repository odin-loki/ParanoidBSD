name: PBSD CI

on:
  push:
    paths:
      - 'pbsd/**'
      - 'tools/**'
      - 'docs/migration/**'
      - 'docs/specs/ANALYSER.md'
      - 'LICENSE'
      - 'LICENSING.md'
      - 'NOTICES.md'
      - 'COMMERCIAL-LICENCE.md'
      - 'LICENSES/**'
      - '.clang-tidy'
      - '.github/workflows/pbsd-ci.yml'
  pull_request:
    paths:
      - 'pbsd/**'
      - 'tools/**'
      - 'docs/migration/**'
      - 'docs/specs/ANALYSER.md'
      - 'LICENSE'
      - 'LICENSING.md'
      - 'NOTICES.md'
      - 'COMMERCIAL-LICENCE.md'
      - 'LICENSES/**'
      - '.clang-tidy'
      - '.github/workflows/pbsd-ci.yml'

jobs:
  build-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build clang clang-tidy clang-tools libbsd-dev python3

      - name: Licence compliance gate
        run: python3 tools/check_licences.py --verbose

      - name: Module + stub counts
        run: python3 tools/count_modules.py

      # tools/mark_converted.py has never been committed - it exists only on
      # the author's machine. Skip rather than fail the whole run, but say so,
      # so the missing gate is visible instead of silently absent.
      - name: Sync conversion ledgers
        run: |
          if [ -f tools/mark_converted.py ]; then
            python3 tools/mark_converted.py --sync
          else
            echo "::warning title=Ledger sync skipped::tools/mark_converted.py is not in the repository. CONVERTED.md and batch_progress.json are not being checked for drift."
          fi

      - name: Configure (L3 thread-safety flags via CMake)
        run: |
          cmake -S pbsd -B build -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # PBSD targets FreeBSD, so a hosted Ubuntu runner cannot build the
      # FreeBSD userland ports: their sources include headers that live inside
      # the FreeBSD tree (math_private.h, namespace.h, fpmath.h) or do not
      # exist on Linux at all (sys/sysctl.h, sys/acl.h, sys/mac.h, uuid.h).
      # Pointing at hbsd/src/lib/libc/include makes it worse, not better -
      # those private headers pull in FreeBSD's sys/*, which shadows glibc.
      #
      # So the build runs to completion with -k 0 and the gate is a ratchet:
      # every failure must already be in the exception list, and anything
      # outside it is a regression. 149 modules are expected to fail; none of
      # them is original PBSD work.
      - name: Build modules
        run: |
          set -o pipefail
          cmake --build build -j"$(nproc)" -- -k 0 2>&1 | tee build.log || true

      - name: Linux build gate (no regressions outside the known-unbuildable set)
        run: python3 tools/check_linux_build.py build.log

      # pbsd.fp is original PBSD work rather than a port, and it depends on
      # nothing FreeBSD, so unlike the 149 modules the ratchet above counts it
      # can be built AND run on a Linux runner. The tests are exhaustive where
      # the domain allows: all 65,536 bfloat16 values and all 2^32 binary32
      # ones. A failure here is a real defect in the arithmetic, not a
      # cross-platform artefact, so this step does not tolerate one.
      - name: Generic float module (pbsd.fp) — build and run its tests
        run: |
          cmake -S pbsd/lib/fp -B build-fp -G Ninja -DCMAKE_CXX_COMPILER=clang++
          cmake --build build-fp -j"$(nproc)"
          ctest --test-dir build-fp --output-on-failure

      # sys/sys/atomic_generic.h replaces six hand-written atomic.h with one.
      # "It compiles" is not the question - the question is whether each
      # operation lowers to an instruction or to a libatomic call, because
      # the kernel has no libatomic. This compiles the header for all six
      # targets, one object per width, and reads the undefined symbols back.
      # Cross-compiling needs no sysroot: the header is compiled against a
      # shimmed <sys/types.h> and nothing else.
      - name: Generic atomics — lock-free on every target
        run: python3 tools/atomic_generic_check.py

      # sys/sys/_stdint_generic.h and _inttypes_generic.h replace five copies
      # each of <machine/_stdint.h> and <machine/_inttypes.h>. They are only a
      # replacement if they expand to the same thing, so this preprocesses
      # both for all six targets and compares every macro - numerically for
      # the limits, textually for the conversions. It has already caught a
      # signedness change in wint_t on riscv and an ABI change to the FAST
      # types, both from trusting a compiler predefine over the tree.
      - name: Generic stdint/inttypes — same expansion as the six headers
        run: python3 tools/stdint_generic_check.py

      # WITHOUT_MACHDEP_OPTIMIZATIONS was set and inert for lib/msun on
      # amd64 and i386 - every reporter said the option was enabled, because
      # it was, and the makefile appended both the C and the assembly under
      # the same object name. Nothing failed and nothing warned. This checks
      # that each of the four consumers still has a mechanism that takes
      # effect, and that a fifth has not appeared without one.
      - name: MACHDEP option — set is not the same as in effect
        run: python3 tools/machdep_option_check.py

      # Every setuid-root binary is a local privilege escalation waiting for
      # a bug. FreeBSD declares them in each program's Makefile, so the set
      # is readable without building. The gate is that the set does not
      # change silently - gaining one from an upstream merge is not
      # something to find out later.
      - name: setuid inventory — the set has not changed
        run: python3 tools/setuid_inventory.py --gate

      # A source that another source #includes by name is not an independent
      # translation unit, so renaming it .c -> .cpp breaks the includer and
      # nothing else notices: the file still exists, SRCS still resolves, no
      # two objects collide, and a zero-edit port is byte-identical. The
      # hundred-file lib/msun batch shipped five such files and stopped
      # buildworld at s_cos.cpp:48 with "'e_rem_pio2.c' file not found",
      # nine minutes into a fifty-minute job. This is a second of work.
      - name: No port has renamed a source another source #includes
        run: python3 tools/check_source_includes.py --gate

      # The compiled-in default of every hardening knob, from the source.
      # show_hardening.sh answers "is PAX_ASLR compiled in"; this answers
      # "and what does hardening.pax.aslr.status default to", which is a
      # different question and the one that decides whether a mitigation is
      # on for a system that does not ask. Reported here; --check compares it
      # against a booted kernel, once there is one.
      - name: Hardening sysctl defaults
        run: python3 tools/hardening_sysctls.py

      # A report, not a gate. arch_duplication.py, atomic_survey.py and
      # asm_inventory.py measure how much per-architecture code there is and
      # arch_interface.py measures how much of it is one interface written
      # several times. None of them can fail the build; they exist so the
      # numbers in docs/CONSOLIDATION.md and docs/PORTABILITY.md are
      # re-measured on every push rather than being a snapshot someone took
      # once and nobody re-ran.
      - name: Per-architecture duplication survey
        run: |
          python3 tools/arch_interface.py hbsd/src --top 15
          echo
          python3 tools/arch_clusters.py hbsd/src --top 12
          echo
          python3 tools/arch_duplication.py hbsd/src --scope sys 2>/dev/null | head -25 || true
          echo
          python3 tools/atomic_survey.py hbsd/src 2>/dev/null | tail -12 || true

      # ctest currently finds no tests - pbsd/CMakeLists.txt is generated with
      # a single library target and no enable_testing(). Kept so the harness
      # is picked up automatically once it is wired in.
      - name: Test SI harness
        run: ctest --test-dir build --output-on-failure

      - name: Migration batch progress summary
        run: |
          python3 tools/convert_c_batch.py --report
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("docs/migration/batch_progress.json")
          data = json.loads(p.read_text())
          print("=== batch_progress.json ===")
          for wave, stats in sorted(data.get("waves", {}).items()):
              print(f"{wave}: converted={stats.get('converted',0)} stubbed={stats.get('stubbed',0)} pending={stats.get('pending',0)} total={stats.get('total',0)}")
          PY

      - name: Inventory summary by wave
        run: python3 tools/sum_inventory.py

      # clang-tidy needs the prebuilt module interfaces to parse a .cppm, and
      # on Linux there are none: CMake will not compile anything until the
      # whole dependency scan succeeds, and it cannot (see the build gate
      # above). Without BMIs, tidy reports "unknown type name 'import'" on
      # every export import line. Run it only when the build produced module
      # files, so this lights up on a FreeBSD runner without failing here.
      - name: L1 — clang-tidy (WarningsAsErrors)
        run: |
          if ! find build -name '*.pcm' -print -quit | grep -q .; then
            echo "::warning title=clang-tidy skipped::No prebuilt module interfaces in build/. C++20 modules cannot be linted without them, and the FreeBSD userland ports do not scan on Linux."
            exit 0
          fi
          clang-tidy -p build \
            pbsd/handles/pbsd.handles.cppm \
            pbsd/bifrost/pbsd.bifrost.cppm \
            pbsd/bifrost/pbsd.bifrost.virtio.cppm \
            pbsd/compositor/pbsd.compositor.cppm \
            pbsd/pkg/pbsd.pkg.cppm

      - name: L2/L4 — analyser plugin build (when LLVM dev packages present)
        run: |
          if [ -f build/analyser/libpbsd_analyser_ownership.so ] || [ -f build/analyser/pbsd_analyser_ownership.so ]; then
            echo "pbsd_analyser built"
          else
            echo "LLVM dev packages absent — L2/L4 plugin skipped (see ANALYSER.md)"
          fi

      - name: Wave 9 inventory report
        run: |
          python3 tools/inventory_c_sources.py
          python3 tools/wave_purge_c_check.py
          # --json does not exist; --metrics emits the rollup and --quiet
          # suppresses the human summary so the artifact is valid JSON.
          python3 tools/wave_purge_c_check.py --metrics --quiet > wave9_purge.json
          cat wave9_purge.json

      - name: Wave 9 purge gate (PBSD 0.1 — fails until owned .c hits zero)
        run: python3 tools/wave_purge_c_check.py --gate
        continue-on-error: true

      # Analyser L2/L4 + pkg skeleton: optional until LLVM dev packages installed.
      # pbsd/pkg (AtomicUpdater) and pbsd/analyser plugins are built when LLVM is present.
      # L1 clang-tidy above covers nucleus handle/bifrost/compositor/pkg modules.

  wave-build-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build clang clang-tools libbsd-dev python3

      # pbsd/_build_wave.sh has never been committed either. Per
      # docs/migration/WAVE_STATUS.md it is a local wrapper around what
      # build-and-gate already does inline (Ninja + Clang, full ctest,
      # inventory and batch scripts), so its absence costs no coverage here.
      - name: Hosted wave build gate
        run: |
          if [ -f pbsd/_build_wave.sh ]; then
            bash pbsd/_build_wave.sh
          else
            echo "::warning title=Wave build gate skipped::pbsd/_build_wave.sh is not in the repository. The build-and-gate job covers the same ground."
          fi
