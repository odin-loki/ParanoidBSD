name: PBSD Wave 0

on:
  push:
    paths:
      - 'pbsd/**'
      - 'docs/specs/**'
      - 'tools/**'
      - '.clang-tidy'
      - '.github/workflows/pbsd-wave0.yml'
  pull_request:
    paths:
      - 'pbsd/**'
      - 'docs/specs/**'
      - 'tools/**'
      - '.clang-tidy'
      - '.github/workflows/pbsd-wave0.yml'

jobs:
  wave0-analyser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy cmake ninja-build python3

      - name: Wave 0 analyser + SI harness + inventory
        run: bash tools/ci/run_wave0_analyser.sh
