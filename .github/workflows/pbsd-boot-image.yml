name: PBSD boot image

# Builds PBSD from hbsd/src on a FreeBSD VM and uploads what it produces.
#
# Manual by default. A buildworld is hours, and the kernel stage alone is
# tens of minutes, so this is not something to run on every push.
#
# The stages are a ladder: kernel proves the config compiles, world proves
# the userland does, and only then is an image worth attempting. Start at
# kernel and climb once each rung is green.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'kernel | world | vm | memstick | iso'
        required: true
        default: 'kernel'
        type: choice
        options: [kernel, world, vm, memstick, iso]
      kernconf:
        description: 'kernel config'
        required: true
        default: 'HARDENEDBSD-MINIMAL'
        type: string
      toolchain:
        description: >-
          internal builds clang from contrib/llvm-project as part of the
          world. external uses the packaged clang21 and turns off
          MK_TOOLCHAIN, so 14,337 files stop being compiled and the world
          stops shipping a compiler - at the cost of self-hosting.
        required: false
        default: 'external'
        type: choice
        options: [external, internal]
      machdep_asm:
        description: >-
          Keep the hand-written machine-dependent assembly in libc, msun and
          libmd. Off means WITHOUT_MACHDEP_OPTIMIZATIONS, which is what
          hbsd/src.conf.pbsd sets: the machine-independent C is used instead.
          Turn it on to build the same tree the other way and compare.
        required: false
        default: false
        type: boolean

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Exec-bit precondition
        # The tree shipped with no executable bits at all, which stopped the
        # build at contrib/bmake/configure. Fail here with a clear message
        # rather than an hour in with a permission error.
        run: python3 tools/check_exec_bits.py

      - name: Vendor-completeness preconditions
        # Two ways the tree can be missing source that the build needs, both
        # cheap to check here and both expensive to hit inside the VM:
        #
        #   * a SUBDIR entry pointing at a directory that is not there. That
        #     is how usr.bin/id was lost - usr.bin/Makefile still listed it.
        #   * a file an ignore rule matched during import. That is how
        #     sys/dev/hpt27xx/amd64-elf.hpt27xx_lib.o was lost, and
        #     buildkernel stopped on it with "don't know how to make".
        run: |
          python3 tools/check_vendor_manifest.py
          python3 tools/check_subdirs.py hbsd/src --fail-on-missing
          python3 tools/check_mk_options.py hbsd/src --fail-on-undefined
          python3 tools/check_clang_srcs.py hbsd/src --fail-on-missing
          python3 tools/check_toolchain_version.py
          python3 tools/check_pbsd_marks.py
          python3 tools/check_c_linkage.py hbsd/src --require-guarded
          python3 tools/check_kernconf_parity.py hbsd/src --fail-on-difference

      - name: Build on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          copyback: true
          mem: 8192
          prepare: |
            pkg install -y python311
            if [ "${{ inputs.toolchain || 'external' }}" != "internal" ]; then
              pkg install -y llvm21
            fi
          # The VM is a separate machine over ssh, so a step-level `env:`
          # never reaches it - the first run silently built HARDENEDBSD
          # instead of the config that was asked for. Set it in the command.
          # SRCCONF is set to hbsd/src.conf.pbsd by the script itself. An
          # empty SRCCONF means FreeBSD's defaults, which is how you get the
          # machine-dependent assembly back.
          run: |
            # Ask the build system what hardening it will actually use. This
            # is where the external toolchain silently turning off SafeStack
            # would have been caught, and was not.
            sh tools/ci/show_hardening.sh "${{ inputs.target || 'amd64' }}" \
               "$PWD/hbsd/src.conf.pbsd" \
               "$([ "${{ inputs.toolchain || 'external' }}" != internal ] && \
                  echo "$PWD/hbsd/toolchains/llvm21.mk" || true)"
            sh tools/ci/show_cxx_config.sh "${{ inputs.target || 'amd64' }}" \
               "$PWD/hbsd/src.conf.pbsd"
            if [ "${{ inputs.machdep_asm }}" = "true" ]; then
              KERNCONF="${{ inputs.kernconf }}" SRCCONF="" \
              TOOLCHAIN="${{ inputs.toolchain }}" \
                sh tools/ci/build_boot_image.sh "${{ inputs.stage }}"
            else
              KERNCONF="${{ inputs.kernconf }}" \
              TOOLCHAIN="${{ inputs.toolchain }}" \
                sh tools/ci/build_boot_image.sh "${{ inputs.stage }}"
            fi

      - name: Collect image
        if: inputs.stage == 'vm' || inputs.stage == 'memstick' || inputs.stage == 'iso'
        run: |
          # build_boot_image.sh copies the image into out/ itself, because it
          # is the only thing that knows where release/ built it - the objdir,
          # not the source tree. This step used to search hbsd/src/release and
          # find nothing, which is how run 12 built a memstick and skipped the
          # boot test anyway.
          mkdir -p out
          ls -lh out/ || echo "no image produced"

      - name: Boot it
        if: inputs.stage == 'vm' || inputs.stage == 'memstick' || inputs.stage == 'iso'
        # Everything before this proves the tree compiles. This is the only
        # step that proves the result runs. It is on the Linux runner, not in
        # the FreeBSD VM: the image is built on FreeBSD because release/ wants
        # a FreeBSD host, but booting it is just QEMU and does not.
        #
        # qemu-system-x86 is already installed - the freebsd-vm action needs
        # it and put it there.
        run: |
          img=$(ls out/vm.raw out/*.img out/*.iso 2>/dev/null | head -1)
          if [ -z "$img" ]; then
            echo "no image to boot"; exit 1
          fi
          # memstick and iso boot to bsdinstall's menu and cannot be asked
          # anything. vm.raw has a login, so that is where the interrogation
          # runs - and the answers are the only place several open questions
          # in this repository can be settled.
          case "$img" in
          *vm.raw)
            python3 tools/ci/boot_test.py "$img" \
              --target amd64 --timeout 420 --shell-timeout 180 \
              --log out/boot.log \
              --run 'uname=uname -a' \
              --run 'hardening=sysctl hardening' \
              --run 'setuid=find / -xdev -type f \( -perm -4000 -o -perm -2000 \) -exec ls -l {} +' \
              --run 'kldstat=kldstat -v | head -50' \
              --run 'pax=sysctl -a | grep -c ^hardening'
            ;;
          *)
            python3 tools/ci/boot_test.py "$img" \
              --target amd64 --timeout 420 --log out/boot.log
            ;;
          esac

      # The compiled-in defaults, against the kernel that just booted. This
      # is the check that show_hardening.sh cannot make.
      - name: Hardening sysctls, against a running kernel
        if: always() && inputs.stage == 'vm'
        run: |
          if [ -f out/hardening.txt ]; then
            python3 tools/hardening_sysctls.py --check out/hardening.txt
          else
            echo "::warning title=No sysctl dump::The boot did not get far enough to produce one."
          fi

      - uses: actions/upload-artifact@v4
        # always(): a failed boot is exactly when the log is wanted.
        if: always() && (inputs.stage == 'vm' || inputs.stage == 'memstick' || inputs.stage == 'iso')
        with:
          name: pbsd-${{ inputs.stage }}-${{ inputs.kernconf }}
          path: out/*
          retention-days: 14
          if-no-files-found: warn
